<body data-shell="b" data-page="public"><!--
  Minimal topbar (§2.1 Skeleton B): brand left, invitation language right.
  No navigation, no marketing copy, no "powered by" footer, and no appearance
  toggle — the invitation's own template is the visual, not the chrome around it.
-->
<header class="guest-topbar">
  <a class="app-brand" href="/"><strong>E-invitation-website</strong></a>
  <div class="guest-topbar__lang" role="group" aria-label="Invitation language">
    <button type="button" data-guest-lang-proxy="en" aria-pressed="true" class="active">EN</button>
    <button type="button" data-guest-lang-proxy="km" lang="km" aria-pressed="false">ខ្មែរ</button>
  </div>
</header>
<a class="skip-link" href="#publicRoot"><span class="i18n i18n-en">Skip to content</span><span class="i18n i18n-km khmer-text" lang="km">Skip to content</span></a>
<main id="publicRoot" class="guest" tabindex="-1"><p>Opening invitation…</p></main>
<span class="guest-demo-badge" role="status"><span class="status-dot" aria-hidden="true"></span><span class="i18n i18n-en">Demo mode — sample data</span><span class="i18n i18n-km khmer-text" lang="km"></span></span>
<!--
  V2-UX-5 (P1-D, WCAG 3.1.1): dynamic <html lang> for the guest invitation page.
  The static fallback is lang="en" (declared on <html> above). After the invitation
  document loads, public-page.js sets root.dataset.language to "km" or "en" and
  also calls document.documentElement.lang = lang inside bindLanguageSwitch().
  The MutationObserver below is a defence-in-depth: if a future change to
  public-page.js drops that direct assignment, the <html lang> attribute will
  still track the data-language value on #publicRoot. The server does not inject
  __INVITATION_LANG__ (sec-1 owns serve_public and chose to escape user-controlled
  values rather than add a new placeholder); the dynamic attribute is therefore
  set client-side only. The script is placed BEFORE bundle-public-v15.js so the
  observer is registered before the bundle's language-switcher first runs.
-->
<script>
  (function () {
    var root = document.getElementById('publicRoot');
    if (!root) return;
    var applyLang = function (value) {
      var lang = value === 'km' ? 'km' : 'en';
      if (document.documentElement.lang !== lang) {
        document.documentElement.lang = lang;
      }
    };
    /* The guest topbar is outside #publicRoot — the only place public-page.js
       looks for [data-guest-lang] buttons — so the topbar delegates to the
       renderer's own switch instead of duplicating the language logic or moving
       the brand inside the invitation. */
    var syncTopbar = function (lang) {
      var buttons = document.querySelectorAll('[data-guest-lang-proxy]');
      for (var i = 0; i < buttons.length; i++) {
        var active = buttons[i].getAttribute('data-guest-lang-proxy') === lang;
        buttons[i].classList.toggle('active', active);
        buttons[i].setAttribute('aria-pressed', String(active));
      }
    };
    if (root.dataset && root.dataset.language) { applyLang(root.dataset.language); syncTopbar(root.dataset.language); }
    document.querySelectorAll('[data-guest-lang-proxy]').forEach(function (button) {
      button.addEventListener('click', function () {
        var lang = button.getAttribute('data-guest-lang-proxy');
        var real = root.querySelector('.language-switch [data-guest-lang="' + lang + '"]');
        if (real) real.click();
        else { root.dataset.language = lang; applyLang(lang); syncTopbar(lang); }
      });
    });
    if (typeof MutationObserver === 'function') {
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          if (records[i].attributeName === 'data-language') {
            var lang = root.getAttribute('data-language');
            applyLang(lang);
            syncTopbar(lang === 'km' ? 'km' : 'en');
            return;
          }
        }
      }).observe(root, { attributes: true, attributeFilter: ['data-language'] });
    }
    /* The renderer creates its language switch asynchronously, so reflect its
       state once it lands (and keep the topbar in sync afterwards). */
    window.addEventListener('load', function () {
      syncTopbar(root.dataset.language === 'km' ? 'km' : 'en');
    });
  })();
</script>
<script src="bundle-public-v15.js"></script>
