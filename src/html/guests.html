<!doctype html><html lang="en"><head><script src="core/theme.js"></script><script src="backend-mode-v14.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Guest List — E-invitation-website</title><link rel="stylesheet" href="bundle-guests-v15.css">  






</head><body data-page="guests"><a class="skip-link" href="#main">Skip to content</a><header><strong>E-invitation-website</strong><a href="dashboard.html" class="button-link">Dashboard</a><a href="checkin.html" class="button-link">Check-in mode</a></header><main id="main" class="guest-admin" tabindex="-1"><div class="top"><h1>Guest list</h1><label class="upload">Import CSV<input id="importFile" type="file" accept=".csv,text/csv"></label><button id="exportBtn">Export CSV</button></div><div id="summary" class="summary"></div><form id="addForm" class="add-form"><label class="sr-only" for="addName">Guest name / ឈ្មោះភ្ញៀវ</label><input id="addName" name="name" placeholder="Guest name" required><label class="sr-only" for="addPhone">Phone number / លេខទូរស័ព្ទ</label><input id="addPhone" name="phone" placeholder="Phone number"><label class="sr-only" for="addEmail">Email / អ៊ីមែល</label><input id="addEmail" name="email" type="email" placeholder="Email"><label class="sr-only" for="addGroup">Group / ក្រុម</label><input id="addGroup" name="groupName" placeholder="Group"><label class="sr-only" for="addHousehold">Household / គ្រួសារ</label><input id="addHousehold" name="householdId" placeholder="Household"><label class="sr-only" for="addTable">Table / តុ</label><input id="addTable" name="tableName" placeholder="Table"><label class="sr-only" for="addSeat">Seat / អាសនៈ</label><input id="addSeat" name="seatLabel" placeholder="Seat"><label class="sr-only" for="addTags">Tags (comma separated) / ស្លាក (ផ្តាច់ដោយក្បៀស)</label><input id="addTags" name="tags" class="wide" placeholder="Tags, comma separated"><button class="primary">Add guest</button></form><div class="filters"><label class="sr-only" for="search">Search name or phone / ស្វែងរកឈ្មោះឬលេខទូរស័ព្ទ</label><input id="search" placeholder="Search name or phone"><label class="sr-only" for="statusFilter">RSVP status / ស្ថានភាព RSVP</label><select id="statusFilter"><option value="all">All RSVP statuses</option><option value="yes">Attending</option><option value="no">Declined</option><option value="pending">Pending</option><option value="checked">Checked in</option></select></div><div id="guestList"></div></main><dialog id="qrModal" aria-modal="true" aria-labelledby="qrModalHeading"><button class="close" aria-label="Close dialog">×</button><h2 id="qrModalHeading" class="sr-only">Guest QR code and personal link</h2><div id="qrBody" class="qr"></div></dialog><script src="bundle-guests-v15.js"></script>
