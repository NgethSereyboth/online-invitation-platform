# render.yaml — Render Blueprint for E-Invitation Website platform
# Free tier: 750 hrs/month, sleeps after 15 min idle (cold start ~30s on wake).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: einvite-platform
    runtime: python
    plan: free
    # rootDir intentionally omitted — the application's Python source
    # (src/python/serve.py, src/python/server.py) imports the `ai_agent`,
    # `platform_v32`, and `future_platform_v52` packages from the
    # repository root.  Render's docs state that "Files outside your
    # service's root directory are not available to the service at build
    # time or at runtime."  With rootDir set to src/python those packages
    # are invisible and the server fails to import.  Removing rootDir
    # makes the entire repository the build context, so serve.py can
    # add the repo root to sys.path and resolve all sibling packages.
    buildCommand: |
      pip install --upgrade pip
      pip install -r docs/requirements-production.txt
    startCommand: cd src/python && python serve.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: EINVITE_SECRET_KEY
        generateValue: true
      - key: EINVITE_PRODUCTION_MODE
        value: "1"
      - key: EINVITE_COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: PYTHONIOENCODING
        value: utf-8
    healthCheckPath: /
    autoDeploy: true
