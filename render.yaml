# render.yaml — Render Blueprint for E-Invitation Website platform
# Free tier: 750 hrs/month, sleeps after 15 min idle (cold start ~30s on wake).
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: einvite-platform
    runtime: python
    plan: free
    rootDir: src/python
    buildCommand: |
      pip install --upgrade pip
      pip install -r ../../docs/requirements-production.txt
    startCommand: python serve.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: EINVITE_SECRET_KEY
        generateValue: true
      - key: EINVITE_PRODUCTION_MODE
        value: "1"
      - key: EINVITE_COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PYTHONIOENCODING
        value: utf-8
    healthCheckPath: /
    autoDeploy: true
